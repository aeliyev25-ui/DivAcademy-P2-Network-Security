# Copy to /etc/systemd/system/suricata.service.d/override.conf on Firewall
# Tested: Suricata 8.0.8 in -q 0 mode; after applying, validate NFQUEUE and reboot.
[Service]
ExecStart=
ExecStart=/usr/bin/suricata -q 0 -c /etc/suricata/suricata.yaml -s /etc/suricata/rules/p2-ips-forward.rules --pidfile /run/suricata.pid --user suricata --group suricata
