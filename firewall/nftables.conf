#!/usr/sbin/nft -f
# P2 — reconstructed, sanitized baseline. Verify with your ACTIVE firewall file before using.
# Do not reload after Tailscale has installed rules without first reconciling flush ruleset.
flush ruleset

table inet p2_filter {
    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state invalid counter drop
        ct state established,related counter accept
        iifname "ens34" oifname "ens33" ip saddr 192.168.10.0/24 counter accept
        iifname "ens38" oifname "ens33" ip saddr 192.168.20.0/24 counter accept
        iifname "ens34" oifname "ens38" ip saddr 192.168.10.0/24 ip daddr 192.168.20.0/24 limit rate 5/second counter log prefix "P2-LAN-DMZ-DROP " drop
        iifname "ens34" oifname "ens42" ip saddr 192.168.10.10 ip daddr 192.168.60.10 tcp dport 2222 counter accept
        iifname "ens39" oifname "ens40" ip saddr 192.168.30.10 ip daddr 192.168.40.10 tcp dport 22 counter accept
        iifname "ens38" oifname "ens34" ip saddr 192.168.20.0/24 ip daddr 192.168.10.0/24 limit rate 5/second counter log prefix "P2-DMZ-LAN-DROP " drop
        limit rate 5/second counter log prefix "P2-FWD-DROP " drop
    }
}
table ip p2_nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        ip saddr 192.168.10.0/24 oifname "ens33" masquerade
        ip saddr 192.168.20.0/24 oifname "ens33" masquerade
    }
}
